<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="header-title">AI Chat</h1>
            <div class="header-actions">
                <button class="icon-btn" id="clearBtn" title="清空对话">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
                </button>
                <button class="icon-btn" id="settingsBtn" title="设置">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                </button>
            </div>
        </header>

        <main class="messages" id="messages">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                </div>
                <h2>开始对话</h2>
                <p>点击右上角 ⚙️ 配置 API 后即可开始</p>
            </div>
        </main>

        <div class="preview-bar" id="previewBar">
            <div class="preview-content" id="previewContent"></div>
            <button class="preview-remove" id="previewRemove" title="移除">&times;</button>
        </div>

        <footer class="input-area">
            <div class="input-row">
                <div class="attach-btns">
                    <button class="icon-btn" id="fileBtn" title="上传文件">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <button class="icon-btn" id="imageBtn" title="上传图片">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    </button>
                    <button class="icon-btn" id="cameraBtn" title="拍照">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    </button>
                </div>
                <textarea class="text-input" id="textInput" placeholder="输入消息..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" title="发送">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </footer>

        <input type="file" id="fileInput" hidden multiple>
        <input type="file" id="imageInput" hidden accept="image/*">
        <input type="file" id="cameraInput" hidden accept="image/*" capture="environment">
    </div>

    <!-- 设置面板 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>API 设置</h2>
                <button class="icon-btn" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="apiUrl">API 地址</label>
                    <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions">
                </div>
                <div class="form-group">
                    <label for="apiKey">API Key</label>
                    <input type="password" id="apiKey" placeholder="sk-xxxxxxxx">
                </div>
                <div class="form-group">
                    <label for="modelName">模型名称</label>
                    <input type="text" id="modelName" placeholder="gpt-4o">
                </div>
                <div class="form-group">
                    <label for="systemPrompt">系统提示词（可选）</label>
                    <textarea id="systemPrompt" rows="3" placeholder="你是一个有帮助的助手。"></textarea>
                </div>
                <div class="form-group">
                    <label for="maxTokens">最大输出 tokens</label>
                    <input type="number" id="maxTokens" placeholder="4096" value="4096">
                </div>
                <div class="form-group">
                    <label for="apiFormat">API 格式</label>
                    <select id="apiFormat">
                        <option value="openai">OpenAI 兼容</option>
                        <option value="anthropic">Anthropic</option>
                    </select>
                </div>
                <button class="save-btn" id="saveSettings">保存设置</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
